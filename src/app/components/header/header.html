<header
  class="overflow-y-hidden w-full fixed top-0 left-0 z-50 h-16 sm:h-18 lg:h-20 transition-all duration-300"
  [ngClass]="isScrolled ? 'bg-[#071827] shadow-md' : 'bg-transparent'"
>
  <div class="mx-auto flex h-full w-full items-center justify-between px-4 sm:px-6 lg:px-8">
    <div
      class="w-12 h-12 sm:w-14 sm:h-14 lg:w-16 lg:h-16 bg-white rounded-full flex items-center justify-center"
    >
      <img src="favicon.ico" alt="MSC Surveyors" class="w-full h-full object-contain scale-130 " />
    </div>

    <!-- Desktop Menu -->
    <nav class="hidden lg:flex flex-1 justify-center min-w-0 px-4">
      <ul class="flex items-center gap-4 xl:gap-8 2xl:gap-10 flex-wrap justify-center">
        <li *ngFor="let item of menuItems">
          <a
            [routerLink]="item.link"
            routerLinkActive="text-sky-500"
            [routerLinkActiveOptions]="{ exact: item.link === '/' }"
            class="whitespace-nowrap text-white font-medium transition duration-300 hover:text-sky-500"
          >
            {{ item.name }}
          </a>
        </li>
      </ul>
    </nav>

    <!-- Right Side (Desktop) -->
    <div class="hidden lg:flex items-center gap-2 xl:gap-4 flex-shrink-0">
      <button
        *ngIf="!isSearchOpen"
        (click)="toggleSearch()"
        aria-label="Open search"
        class="flex items-center justify-center rounded-full bg-[#10253a] p-3 text-white hover:bg-sky-600 transition"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
          />
        </svg>
      </button>

      <div
        *ngIf="isSearchOpen"
        class="flex items-center rounded-full bg-[#10253a] px-4 py-2 w-40 xl:w-64"
      >
        <input
          type="text"
          [(ngModel)]="searchText"
          (keyup.enter)="search()"
          placeholder="Search..."
          class="bg-transparent outline-none text-white w-full placeholder:text-gray-400 min-w-0"
        />
        <button
          (click)="search()"
          aria-label="Search"
          class="ml-2 flex-shrink-0 text-white hover:text-sky-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
            />
          </svg>
        </button>
      </div>

      <button
        (click)="toggleLanguage()"
        class="whitespace-nowrap p-3 text-white hover:bg-sky-600 rounded-full bg-[#10253a] transition"
      >
        🌐 EN ▼
      </button>

      <a
        routerLink="/contact"
        class="whitespace-nowrap rounded-md bg-sky-500 px-4 xl:px-6 py-2 text-sm xl:text-base font-semibold text-white transition duration-300 hover:bg-sky-600"
      >
        Request Survey
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle menu"
      class="lg:hidden flex items-center justify-center rounded-md p-2 text-white hover:bg-[#10253a] transition flex-shrink-0"
    >
      <!-- Hamburger / Close swap -->
      <svg
        *ngIf="!isMenuOpen"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        class="h-6 w-6 sm:h-7 sm:w-7"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
      <svg
        *ngIf="isMenuOpen"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        class="h-6 w-6 sm:h-7 sm:w-7"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
</header>

<!-- Mobile Menu: sibling of <header>, NOT nested inside the fixed box.
     This is what actually fixes the overflow/"not fitting" bug — a fixed
     element sizes to its content, so nesting a min-h-screen panel inside it
     made the box taller than the viewport with no way to scroll to the rest. -->
<div
  *ngIf="isMenuOpen"
  class="lg:hidden fixed inset-0 top-16 sm:top-18 z-40 h-[calc(100vh-4rem)] sm:h-[calc(100vh-4.5rem)] overflow-y-auto bg-[#0b2942] border-t border-white/10"
>
  <div class="px-5 py-5">
    <!-- Mobile search -->
    <div class="flex items-center rounded-full bg-[#173955] px-4 py-3 mb-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-400 flex-shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
        />
      </svg>
      <input
        type="text"
        [(ngModel)]="searchText"
        (keyup.enter)="search()"
        placeholder="Search..."
        class="bg-transparent outline-none text-white w-full ml-3 placeholder:text-gray-400 min-w-0"
      />
    </div>

    <!-- Mobile language toggle -->
    <button
      (click)="toggleLanguage()"
      class="w-full text-left mb-6 px-4 py-3 text-white bg-[#173955] hover:bg-[#3c8dcb] rounded-full transition"
    >
      🌐 EN ▼
    </button>

    <ul class="space-y-2">
      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.link"
          (click)="isMenuOpen = false"
          class="flex items-center justify-between bg-[#173955] hover:bg-[#3c8dcb] transition-all duration-300 px-5 py-5 text-white font-semibold"
        >
          <span>{{ item.name }}</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4 opacity-70 flex-shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </a>
      </li>
    </ul>

    <div class="border-t border-white/10 my-6"></div>

    <a
      routerLink="/contact"
      (click)="isMenuOpen = false"
      class="block w-full text-center bg-[#3d90cf] hover:bg-[#2b7fc0] text-white py-3 font-semibold transition"
    >
      Request Survey
    </a>

    <div class="text-center mt-8 text-gray-400 text-sm break-words">info@mscsurveyors.org</div>
  </div>
</div>
