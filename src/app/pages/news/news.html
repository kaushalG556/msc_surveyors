<!-- Hero Banner Section -->
<section
  class="relative h-[250px] sm:h-[300px] md:h-[350px] lg:h-[420px] bg-cover bg-center"
  style="background-image: url('images/about-small.avif')"
>
  <!-- Overlay -->
  <div class="absolute inset-0 bg-[#08203A]/80"></div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-4">

    <!-- Badge -->
    <div class="mb-4 sm:mb-6">
      <span class="inline-flex items-center gap-2 px-4 py-2 sm:px-6 sm:py-3 text-blue-400 uppercase font-bold rounded-full border border-white/30 bg-white/10 backdrop-blur-sm text-xs sm:text-sm tracking-wide">
        <img
          src="images/about-icon/blank-page.png"
          alt="icon"
          class="w-4 h-4 sm:w-5 h-5 object-contain brightness-0"
        />
        News &amp; Articles
      </span>
    </div>

    <!-- Heading -->
    <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-white tracking-tight">
      News &amp; Insights
    </h1>

    <!-- Subtitle -->
    <p class="mt-2 sm:mt-3 text-xs sm:text-sm md:text-base lg:text-lg text-white/60 max-w-md mx-auto">
      Maritime updates and regulations
    </p>

  </div>
</section>

<!-- Empty Publications Section -->
<div class="min-h-auto bg-white py-12 sm:py-16 md:py-20 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <div class="text-2xl sm:text-3xl font-semibold mb-6 sm:mb-10 text-gray-900">
      <h2 class="text-center sm:text-left">All Publications</h2>
    </div>
    
    <!-- Empty Container Fix -->
    <div class="flex flex-col items-center justify-center text-center py-10 sm:py-16 border border-dashed border-gray-200 rounded-2xl bg-gray-50/50">
      <div class="bg-gray-200 w-12 h-12 sm:w-15 sm:h-15 flex items-center justify-center rounded-full shadow-sm mb-4">
        <img src="images/about-icon/blank-page.png" class="w-6 h-6 sm:w-7 sm:h-7 object-contain opacity-60" alt="icon" />
      </div>
      <p class="text-lg sm:text-xl md:text-2xl text-gray-400 font-medium max-w-md px-4">
        No more articles available at this time.
      </p>
    </div>
  </div>
</div>

<!-- Newsletter Subscription Section -->
<div class="min-h-auto flex items-center justify-center bg-[#041226] text-white py-12 sm:py-16 md:py-20 px-4 sm:px-6 relative overflow-hidden font-sans">
    <!-- Background Radial Gradient Overlay -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(16,42,73,0.5)_0%,_rgba(4,18,38,1)_100%)] z-0"></div>
    <!-- Background Dot Pattern Overlay -->
    <div class="absolute inset-0 bg-dots z-0"></div>

    <!-- Container Card -->
    <div class="w-full max-w-xl text-center px-2 sm:px-4 z-10">
        <!-- Title -->
        <h2 class="text-2xl sm:text-3xl md:text-[2.25rem] font-medium tracking-tight mb-3 sm:mb-4 text-[#f8fafc]">
            Stay Informed
        </h2>
        
        <!-- Description -->
        <p class="text-[#a0aec0] text-sm sm:text-base md:text-lg font-light leading-relaxed mb-6 sm:mb-8 max-w-md mx-auto">
            Subscribe to receive the latest news and updates from the maritime industry.
        </p>
        
        <!-- Responsive Row Form -->
        <form onsubmit="event.preventDefault();" class="flex flex-col sm:flex-row gap-3 sm:gap-2 max-w-lg mx-auto">
            <!-- Email Input -->
            <div class="relative flex-1">
                <input 
                    type="email" 
                    placeholder="Your email address" 
                    required 
                    aria-label="Your email address"
                    class="w-full px-4 py-3 sm:py-4 bg-white/5 border border-white/15 rounded-lg sm:rounded-l-lg sm:rounded-r-none text-white text-sm sm:text-base outline-none transition-all duration-200 placeholder-[#4a5568] focus:border-[#3182ce] focus:bg-white/10"
                >
            </div>
            
            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full sm:w-auto px-6 py-3 sm:py-4 bg-[#3182ce] hover:bg-[#2b6cb0] active:scale-[0.99] text-white text-sm sm:text-base font-semibold rounded-lg sm:rounded-r-lg sm:rounded-l-none transition-all duration-150 shadow-md cursor-pointer whitespace-nowrap"
            >
                Subscribe
            </button>
        </form>
        
        <!-- Disclaimer Text -->
        <p class="mt-4 text-xs sm:text-[0.85rem] text-[#4a5568] font-normal tracking-wide">
            No spam. You can unsubscribe at any time.
        </p>
    </div>
</div>
